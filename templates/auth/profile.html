{% extends "base.html" %}

{% block title %}My Profile : BioPrint Vision{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-6">
        <div class="card p-4">
            <h4 class="fw-bold mb-3"><i class="bi bi-person-gear text-danger me-2"></i>Account Profile</h4>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Email (Non-editable)</label>
                    <input type="text" class="form-control bg-light" value="{{ user.email }}" readonly>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Role</label>
                    <input type="text" class="form-control bg-light" value="{{ user.role }}" readonly>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Full Name</label>
                    <input type="text" name="name" class="form-control" value="{{ user.name }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Update Password (Optional)</label>
                    <input type="password" name="new_password" class="form-control" placeholder="Leave blank to keep current password" minlength="6">
                </div>
                <button type="submit" class="btn btn-rose px-4">Save Changes</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
